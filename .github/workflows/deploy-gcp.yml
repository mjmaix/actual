name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gcp

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Compute Engine
        run: |
          gcloud compute ssh "${{ vars.GCP_VM_NAME }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet \
            --command='
              set -e
              docker pull docker.io/actualbudget/actual-server:latest
              docker rm -f actual-budget 2>/dev/null || true
              docker run -d \
                --name actual-budget \
                --restart unless-stopped \
                -p 127.0.0.1:5007:5006 \
                -v /var/lib/actual-budget:/data \
                docker.io/actualbudget/actual-server:latest
              docker rm -f actual-nginx 2>/dev/null || true
              docker run -d \
                --name actual-nginx \
                --restart unless-stopped \
                --network host \
                -v /var/lib/nginx/conf.d:/etc/nginx/conf.d:ro \
                nginx:alpine
            '

      - name: Verify deployment
        run: |
          EXTERNAL_IP=$(gcloud compute instances describe "${{ vars.GCP_VM_NAME }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(networkInterfaces[0].accessConfigs[0].natIP)")
          sleep 10
          curl -sSf -o /dev/null "http://$EXTERNAL_IP:5006" && echo "✓ Server is up and serving"